name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting (non-blocking)
        # 历史代码未逐条格式化，此处仅提示，不阻断 CI
        run: cargo fmt --all -- --check || echo "::warning::部分源码未格式化（历史遗留），不影响构建与测试"

      - name: Clippy
        # 历史代码有少量 dead_code 警告，降级为提示而非阻断
        run: cargo clippy --all-targets || echo "::warning::clippy 报告了非致命警告"

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test --all-targets
